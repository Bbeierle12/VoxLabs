name: android

# Builds the arm64 debug APK (the same artifact as
# `npm run tauri android build -- --apk --debug -t aarch64`, see docs/PACKAGING.md)
# and uploads it so a phone build is one click away without a local SDK.
#
# Triggers are deliberately narrower than ci.yml: the job takes ~15 min, so
# pull requests only build when packaging inputs change. Use "Run workflow"
# for an APK of any branch.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with docs/PACKAGING.md and src-tauri/gen/android/app/build.gradle.kts.
  ANDROID_PLATFORM: android-36
  ANDROID_BUILD_TOOLS: 36.1.0
  ANDROID_NDK: 28.2.13676358

jobs:
  apk:
    name: debug APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The runner image ships Temurin JDKs; AGP 8.11 needs 17+, the docs use 21.
      - name: Select JDK 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      # The image also ships the SDK command-line tools; install the exact
      # platform / build-tools / NDK the Gradle project pins.
      - name: Install Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" \
            "platforms;$ANDROID_PLATFORM" \
            "build-tools;$ANDROID_BUILD_TOOLS" \
            "ndk;$ANDROID_NDK"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK" >> "$GITHUB_ENV"

      - name: Add Rust Android target
        run: rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build debug arm64 APK
        run: npm run tauri android build -- --apk --debug --target aarch64 --ci

      - name: Report APK
        run: |
          APK=src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          ls -l "$APK"
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt" dump badging "$APK" \
            | grep -E "^package:|sdkVersion|targetSdkVersion|uses-permission|native-code" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: coral-android-arm64-debug
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          if-no-files-found: error
          retention-days: 14
