# Atlas — Plan v3 Phase 3: the Vocal Tract Lab chain on the VoxLabs
# pipeline. The same front end as live_model (yin → voicing → lpc →
# harmonics → metrics → contour), then the posterior inverse, the
# MRI-reduced area function and the lumen mesh (D10 backends #2), and the
# STFT for the waterfall. Every stage output is tapped.

name = "atlas"

taps = ["yin", "voicing", "lpc", "harmonics", "metrics", "contour", "inverse", "tract", "mesh", "stft"]

[format]
sample_rate_hz = 48000.0
frame_samples = 2048
hop = 1024

[runner]
# Idle sleep between ring-buffer drains, ms. Range: 1..=10.
poll_ms = 5
# Tap channel depth, messages. A full channel drops and counts. Range: 8..=256.
tap_capacity = 256
# Timing summary to the log every this many hops. Range: 47..=4700.
report_every_hops = 512
# Gate: worst hop < this fraction of the hop budget. Range: 0.1..=1.0.
hop_budget_fraction_max = 0.5
# Gate: mic-to-render latency ceiling, ms. Range: 20.0..=200.0.
mic_to_render_max_ms = 100.0
# The shell waits this long for the worker's init, ms. Range: 500..=10000.
init_timeout_ms = 4000
# Frame-cadence consumers run every this many hops. Range: 1..=4.
legacy_frame_every_hops = 2
# Drained-but-unconsumed audio the re-framer reserves, frames. Range: 1..=8.
pending_capacity_frames = 2

[[stage]]
name = "yin"
backend = "yin_cpu"

[[stage]]
name = "voicing"
backend = "snr_hum"

[[stage]]
name = "lpc"
backend = "lpc_levinson"

[[stage]]
name = "harmonics"
backend = "goertzel"

[[stage]]
name = "metrics"
backend = "classic"

[[stage]]
name = "contour"
backend = "f0_contour"

# Vocal Tract Lab's posterior: F1..F3 → four atlas mode coefficients with
# confidence and abstention (reads the voicing-gated F0Track, the LPC
# formants and the metrics' HNR/SNR).
[[stage]]
name = "inverse"
backend = "posterior_pca4"

# The reduced model's 32-section area function.
[[stage]]
name = "tract"
backend = "mri_pca4"

# The lumen surface mesh with its uncertainty envelope.
[[stage]]
name = "mesh"
backend = "lumen_v2"

[[stage]]
name = "stft"
backend = "rustfft"
