[package]
name = "vox-core"
version = "0.1.0"
edition = "2024"

# The crate is both an rlib (linked by the desktop/web `[[bin]]`) and a cdylib
# (`libvox_core.so`, which the Android APK loads and whose
# `android_main` symbol android-activity's NativeActivity glue calls). Desktop
# and web are unaffected: they keep using the rlib via the binary target.
[lib]
crate-type = ["rlib", "cdylib"]

# The Fach Lab study harness: decodes audio files and runs them through the
# same FrameAnalyzer the phone runs. Desktop only (it links the decoders).
[[bin]]
name = "voxlab"
path = "src/bin/voxlab.rs"

# Shared across every target (native desktop, Android, web/wasm). Pure-Rust and
# wasm-compatible. eframe here is a minimal common base with no renderer/backend
# features; each platform block below turns on exactly what it needs so that the
# feature sets never collide (notably: `accesskit` is incompatible with
# `android-native-activity`, so Android must not receive it).
[dependencies]
aberth = "0.4.1"
anyhow = "1.0.102"
# CPP (cepstral peak prominence): pure-Rust FFT, fine on Android and wasm.
rustfft = "6"
atomic_float = "1.1.0"
bytemuck = "1.25.0"
crossbeam-utils = "0.8.21"
eframe = { version = "0.34.3", default-features = false, features = ["default_fonts"] }
egui = "0.34.3"
log = "0.4.32"
rtrb = "0.3.4"
# Archive/reference disk persistence: a small JSON blob (serde) written to a
# per-platform data dir. Pure-Rust, so it builds identically on desktop,
# Android, and wasm.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
triple_buffer = "9.0.0"
toml = "1.1.5"

# Desktop + web: restore eframe's stock default feature set, so those two targets
# behave identically to before this Android work (wgpu renderer, accesskit,
# wayland/x11, web screen reader). eframe's own default also enables `winit/default`
# — which can't be named from a consumer's feature list — so the desktop winit dep
# below re-adds it directly.
#
# --- Accepted advisories (review phase H, gate G4) ------------------------------
# `cargo audit` reports two high-severity quick-xml DoS advisories against the
# 0.39.4 in our lockfile:
#   RUSTSEC-2026-0194  quadratic run time on duplicate start-tag attribute names
#   RUSTSEC-2026-0195  unbounded namespace-declaration allocation in NsReader
# Both are fixed in quick-xml >= 0.41, which nothing in this tree can reach:
# `wayland-scanner 0.31` and `zbus_xml 5.1` both require `^0.39`, so a `--precise`
# bump is refused by the resolver, not merely inconvenient.
#
# G4 asked whether to drop `accesskit` here to shed the advisory. Re-checked
# 2026-08-19: that no longer works. quick-xml now enters through TWO paths —
# accesskit -> atspi -> zbus_xml, and (independently) wayland -> sctk-adwaita ->
# wayland-scanner. Dropping accesskit would cost screen-reader support and still
# leave quick-xml in the tree. Accept and track stands, for a stronger reason
# than when it was first recorded.
#
# Exposure: both advisories are denial-of-service on hostile XML input. The
# wayland path parses protocol XML that ships with the build; the zbus path
# parses D-Bus introspection from the local session bus. Neither reads anything
# a remote party controls.
#
# Also tracked (warning tier, no fix in range): RUSTSEC-2026-0192, `ttf-parser`
# 0.25 unmaintained, pinned via winit -> sctk-adwaita -> ab_glyph. It resolves
# with the eframe/winit upgrade, which is the same upgrade that would unblock
# real `MainEvent::Destroy` handling on Android (see src/android.rs).
#
# Re-run `cargo audit` each phase. Fixed by targeted update on 2026-08-19:
# RUSTSEC-2026-0257 (webbrowser 1.2.1 -> 1.2.4) and RUSTSEC-2026-0221
# (event-listener 5.4.1 -> 5.4.2).
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.34.3", default-features = false, features = [
    "accesskit",
    "wayland",
    "web_screen_reader",
    "wgpu",
    "x11",
] }

# Native desktop + Android: real audio I/O (cpal). cpal's Android backend is
# pure-NDK AAudio (ndk "audio" + jni), both already in the lockfile.
# chrono (clock only, no default features) stamps saved sessions with the real
# local date; its tz lookup works on Android too (iana-time-zone). The web
# target skips it — no persistence there, so sessions are ephemeral anyway.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.18.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Raw-audio capture export (src/capture_log.rs): 32-bit float WAV writer,
# pure Rust, on every target that records. The `voxlab` harness also uses
# it for synthetic fixtures.
hound = "3.5"
# File import (src/audio_file.rs), in the app and in the `voxlab` harness:
# pure-Rust decoding of WAV/FLAC/MP3/AAC/Vorbis. Pure Rust, so it builds for
# Android unchanged; the web target has no files to decode.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "wav", "pcm", "isomp4", "aac", "vorbis", "ogg"] }

# Desktop only: the wgpu GPU-compute analysis path + its blocking executor and
# logger, plus winit's default backends (x11/wayland, matching eframe's stock
# `winit/default`). Android takes the CPU DSP path instead, so it never compiles
# wgpu — keeping wgpu-on-Vulkan-Android out of the build entirely (de-risked).
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
wgpu = "29.0.3"
pollster = "0.4.0"
env_logger = "0.11.10"
winit = "0.30.13"

# Android only: android-activity's NativeActivity glue provides the `android_main`
# entry (via winit's `android-native-activity` backend), eframe renders through
# glow/EGL (GLES — de-risked vs wgpu/Vulkan for a first build), and android_logger
# routes `log` to logcat.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.34.3", default-features = false, features = ["glow", "android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
winit = { version = "0.30.13", default-features = false, features = ["android-native-activity", "rwh_06"] }
# Device capability probe (src/device_probe.rs): talks to AudioManager /
# AudioRecord / MicrophoneInfo over JNI. Both crates are already in the
# lockfile under cpal's Android backend — this only makes them direct.
jni = "0.22"
ndk-context = "0.1"

# Web (wasm) only: browser bindings + panic hook for eframe's web backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
# `HtmlElement`/`Node`/`console` are what `report_startup_failure` needs to put
# a startup error on the page (body → create_element → set_text_content) instead
# of panicking to a blank canvas.
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "Node",
    "Window",
    "console",
] }

# --- Android APK packaging (cargo-apk / cargo apk) ------------------------------
# Release signing is NOT configured here on purpose: cargo-apk reads the keystore
# path + password from the CARGO_APK_RELEASE_KEYSTORE[_PASSWORD] env vars, so no
# secret is committed. See docs/android-build.md.
[package.metadata.android]
package = "org.voxlabs.core"
apk_name = "vox-core"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
# 26 (Android 8.0), not 24: cpal's Android backend links libaaudio, and AAudio —
# the low-latency capture/playback path this instrument targets — was added in
# API 26. cargo-apk compiles against the min_sdk API level, so 24 fails to link
# (`-laaudio` unavailable). 26 is the floor for AAudio anyway.
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Voice Harmonic Engine"

# Real-time microphone capture. This is a runtime ("dangerous") permission on
# Android 6+; declaring it here is necessary but NOT sufficient — the app/user
# must also grant it at runtime (see docs/android-build.md).
[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"

# "Share → VoxLabs" / "Open with VoxLabs" for audio files (src/share_intent.rs).
# cargo-apk adds the MAIN/LAUNCHER filter itself when none is declared, so it
# has to be spelled out once we declare any.
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.SEND"]
categories = ["android.intent.category.DEFAULT"]
[[package.metadata.android.application.activity.intent_filter.data]]
mime_type = "audio/*"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW"]
categories = ["android.intent.category.DEFAULT"]
[[package.metadata.android.application.activity.intent_filter.data]]
mime_type = "audio/*"
