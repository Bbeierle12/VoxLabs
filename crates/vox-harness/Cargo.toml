[package]
name = "vox-harness"
version = "0.1.0"
edition = "2024"
description = "voxlab — the Fach Lab study harness: runs audio files through the same pipeline the phone runs, headless"
publish = false

[[bin]]
name = "voxlab"
path = "src/main.rs"

[dependencies]
vox-core = { path = "../.." }
vox-validation = { path = "../vox-validation" }
anyhow = "1.0.102"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
